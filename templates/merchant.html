<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receive Payment — Merchant POS Terminal</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- Large Obvious Navigation Bar -->
  <header class="top-nav">
    <div class="nav-inner">
      <a href="/merchant" class="nav-brand">
        <span>Offline UPI</span>
        <span class="nav-brand-badge">Merchant (Port 5002)</span>
      </a>
      <nav class="nav-menu">
        <a href="http://localhost:5001/payer" class="nav-item" data-role="payer">Payer</a>
        <a href="http://localhost:5002/merchant" class="nav-item active" data-role="merchant">Merchant</a>
        <a href="http://localhost:5003/bank" class="nav-item" data-role="bank">Bank</a>
      </nav>
    </div>
  </header>

  <main class="app-container">
    <h1 class="page-title">Receive Payment</h1>
    <p class="page-subtitle">
      Merchant POS: <strong>Bob's Store</strong> (<span id="merchant-id-display">merchant_bob@upi</span>)
    </p>

    <!-- Paste & Verify Card -->
    <div class="card">
      <div class="form-group">
        <label class="form-label" for="token-paste-input">Paste Payment JSON</label>
        <textarea
          id="token-paste-input"
          class="form-textarea"
          rows="6"
          placeholder='Paste the payment JSON from the Payer Dashboard here (e.g. {"payload": {...}, "signature": "..."})'
        ></textarea>
      </div>

      <button type="button" id="btn-verify-token" class="btn-primary">
        Verify Payment
      </button>

      <!-- Clear Verification Result Container -->
      <div id="verification-result-box" style="display: none; margin-top: 24px;"></div>
    </div>

    <!-- Bank Synchronisation Card -->
    <div class="card">
      <h2 class="card-title">Bank Settlement</h2>
      <p id="queue-summary-text" style="font-size: 19px; color: var(--text-muted); margin-bottom: 20px;">
        Checking pending offline payments...
      </p>

      <button type="button" id="btn-sync-bank" class="btn-primary btn-success" disabled>
        Sync with Bank
      </button>

      <div id="sync-report-box" style="display: none; margin-top: 20px;"></div>
    </div>

    <!-- Optional Collapsible Payment History -->
    <details class="technical-details">
      <summary>View Received Payments</summary>
      <div class="details-content">
        <div style="display: flex; justify-content: flex-end; margin-bottom: 12px;">
          <button type="button" id="btn-refresh-queue" class="btn-secondary" style="font-size: 14px; padding: 6px 14px;">Refresh</button>
        </div>
        <div class="table-wrapper">
          <table class="simple-table">
            <thead>
              <tr>
                <th>Token ID</th>
                <th>Payer</th>
                <th>Amount</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="merchant-queue-tbody"></tbody>
          </table>
        </div>
        <div id="queue-empty-state" class="empty-state" style="display: none;">
          No payments received yet.
        </div>
      </div>
    </details>
  </main>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/merchant.js"></script>
</body>
</html>
